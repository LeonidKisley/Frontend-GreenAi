<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Green AI | Registro</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23059669' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z'/><path d='M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <script>try{if(localStorage.getItem('greenai-theme')==='light'){document.documentElement.classList.add('light-mode');}}catch(e){}</script>
</head>
<body class="auth-page page-shell">
  <div class="auth-shell">
    <div class="auth-panel glass-panel">
      <div class="auth-topbar">
        <div class="auth-brand"><i class="fa-solid fa-user-gear neon-icon"></i> Green AI</div>
        <div class="auth-topbar-actions">
          <button id="theme-toggle" class="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Cambiar tema">
            <span class="theme-track"><i class="fa-solid fa-sun"></i><span class="theme-thumb"></span><i class="fa-solid fa-moon"></i></span>
          </button>
          <a href="index.html" class="auth-link"><i class="fa-solid fa-arrow-left"></i> Volver</a>
        </div>
      </div>

      <div class="auth-header">
        <h1>Crear Cuenta</h1>
        <p>Registra un operador para acceder a paneles, métricas y topología.</p>
      </div>

      <form id="register-form" novalidate>
        <div class="form-grid">
          <div class="input-group">
            <i class="fa-solid fa-id-card"></i>
            <input id="nombre_completo" type="text" placeholder="Nombre completo" required />
          </div>

          <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input id="email" type="email" placeholder="Correo institucional" required />
          </div>

          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input id="password" type="password" placeholder="Contraseña" required />
          </div>

          <div class="input-group">
            <i class="fa-solid fa-user-shield"></i>
            <input id="confirm_password" type="password" placeholder="Confirmar contraseña" required />
          </div>

          <p>Tu cuenta recibirá los permisos asignados por el sistema.</p>

          <button class="btn btn-primary submit-btn" type="submit">
            <i class="fa-solid fa-user-plus"></i> Registrar operador
          </button>
        </div>
      </form>

      <div id="message" class="message-box" aria-live="polite"></div>

      <div class="form-footer">
        ¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a>
      </div>
    </div>
  </div>

  <script src="config.local.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
  <script src="appearance.js"></script>
  <script src="app.js"></script>
</body>
</html>
