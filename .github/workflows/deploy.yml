
name: Deploy Green AI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run frontend tests
        run: node --test tests/frontend.test.cjs

      - name: Validate Supabase variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"

      - name: Prepare static files
        run: |
          mkdir -p dist
          cp ./*.html dist/
          cp ./*.css dist/
          cp ./*.js dist/
          cp favicon.svg dist/

      - name: Generate config.local.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "supabaseUrl": os.environ["SUPABASE_URL"],
              "supabasePublishableKey": os.environ["SUPABASE_PUBLISHABLE_KEY"],
              "gatewayBaseUrl": "https://green-ai-gateway-1.onrender.com"
          }

          Path("dist/config.local.js").write_text(
              "window.GREEN_AI_CONFIG = Object.freeze("
              + json.dumps(config)
              + ");\n",
              encoding="utf-8"
          )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
